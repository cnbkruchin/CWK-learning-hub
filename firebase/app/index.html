<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5fbf">
  <meta name="description" content="CWK Learning Hub — ส่งงาน จัดกลุ่ม ให้คะแนน และดูคะแนนแบบเรียลไทม์">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CWK Hub">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>CWK Learning Hub</title>
</head>
<body>
  <a class="skip" href="#main">ข้ามไปเนื้อหา</a>
  <header class="topbar no-print" id="topbar" hidden>
    <button class="icon-btn" id="btn-home" aria-label="หน้าหลัก">⌂</button>
    <div class="brand"><span id="app-name">CWK Learning Hub</span><small id="school-name"></small></div>
    <div class="top-actions">
      <span class="small muted hide-sm" id="live-state" title="สถานะการเชื่อมต่อแบบเรียลไทม์"><span class="live-dot"></span>เรียลไทม์</span>
      <select id="role-switch" aria-label="เลือกบทบาท" hidden></select>
      <button class="icon-btn" id="btn-notify" aria-label="แจ้งเตือน">🔔<span class="badge" id="notify-count" hidden></span></button>
      <button class="btn ghost small" id="btn-logout">ออกจากระบบ</button>
    </div>
  </header>
  <div class="offline-banner no-print" id="offline-banner" hidden>ออฟไลน์ — แสดงข้อมูลล่าสุดที่บันทึกไว้ในเครื่อง ระบบจะซิงก์ให้อัตโนมัติเมื่อกลับมาออนไลน์</div>
  <div class="demo-banner no-print" id="demo-banner" hidden>ระบบสาธิต — ข้อมูลทั้งหมดเป็นข้อมูลสมมติ</div>
  <div class="install-banner no-print" id="install-banner" hidden><span>ติดตั้งแอปไว้บนหน้าจอหลักเพื่อเปิดได้เร็วขึ้น</span><span><button class="btn small" id="btn-install">ติดตั้ง</button> <button class="btn ghost small" id="btn-install-no">ไม่ใช่ตอนนี้</button></span></div>
  <main id="main" tabindex="-1"><div class="loading">กำลังโหลด…</div></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-body" id="modal-body"></div></dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
