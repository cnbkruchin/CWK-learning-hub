<script>
/**
 * หน้าจัดการ: สมัครใช้งาน, รายวิชา/ทะเบียนผู้เรียน, กลุ่มประจำรายวิชา (ครูและนักเรียน), หน้าผู้ดูแล (นักเรียน ครู รายวิชา คำขอลงทะเบียน)
 * ใช้ตัวช่วยกลางจาก window.CWK (ui/App) — ทุกการตรวจสิทธิ์และเงื่อนไขทำที่เซิร์ฟเวอร์ หน้าเว็บแค่ซ่อนปุ่มที่ไม่มีสิทธิ์
 */
(function (C) {
  'use strict';
  var views = C.views, api = C.api, h = C.h, q = C.q, qa = C.qa, on = C.on, esc = C.esc, toast = C.toast, errBox = C.errBox;
  var go = C.go, swap = C.swap, back = C.back, render = C.render, backBtn = C.backBtn, bindBack = C.bindBack, fmtDate = C.fmtDate;
  var STUDENT_STATUS = { active: 'กำลังศึกษา', graduated: 'จบการศึกษา', transferred: 'ย้ายโรงเรียน', withdrawn: 'ลาออก', inactive: 'ไม่ใช้งาน' };
  var ENR_STATUS = { active: 'กำลังเรียน', withdrawn: 'ถอนรายวิชา', transferred_out: 'ย้ายออก', completed: 'จบรายวิชา' };
  var PREFIXES = ['เด็กชาย', 'เด็กหญิง', 'นาย', 'นางสาว', 'นาง'];

  /** ดาวน์โหลดไฟล์จากข้อมูลในหน้า (CSV/XLSX) โดยไม่ผ่านลิงก์สาธารณะ */
  function download(name, mime, data) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }
  /** CSV สำหรับ Excel: UTF-8 BOM + ป้องกันข้อความที่ขึ้นต้นด้วย = + - @ ถูกตีความเป็นสูตร */
  function csv(rows) {
    return '﻿' + rows.map(function (r) {
      return r.map(function (v) {
        var s = String(v === null || v === undefined ? '' : v);
        if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
  }
  C.download = download;
  C.csv = csv;

  function offeringHeader(o) {
    return '<div class="breadcrumb">ปี ' + esc(o.yearBe) + ' / ภาคเรียนที่ ' + esc(o.termNo) + ' · ครู ' + esc(o.ownerName) + '</div>' +
      '<h1>' + esc(o.courseCode) + ' ' + esc(o.courseName) + ' (' + esc(o.section) + ')</h1>';
  }
  C.offeringHeader = offeringHeader;

  function pickList(name, people, opts) {
    opts = opts || {};
    if (!people.length) return '<div class="muted small">' + esc(opts.empty || 'ไม่มีรายชื่อ') + '</div>';
    return '<div class="small"><label class="check" style="margin:0"><input type="checkbox" data-all="' + name + '"> เลือกทั้งหมด (' + people.length + ' คน)</label></div>' +
      '<div class="pick-list" role="group" aria-label="' + esc(opts.label || 'รายชื่อ') + '">' + people.map(function (s) {
        return '<label><input type="checkbox" name="' + name + '" value="' + esc(s.id || s.studentId) + '"> ' +
          (s.code ? '<span class="muted">' + esc(s.code) + '</span> ' : '') + esc(s.name) + ' <span class="small muted">' + esc(s.roomLabel || '') + '</span></label>';
      }).join('') + '</div>';
  }
  function bindPickAll(root) {
    on('[data-all]', 'change', function (e) {
      var name = e.currentTarget.getAttribute('data-all');
      qa('[name="' + name + '"]', root).forEach(function (x) { x.checked = e.currentTarget.checked; });
    }, root);
  }
  function picked(name, root) { return qa('[name="' + name + '"]:checked', root).map(function (x) { return x.value; }); }
  C.pickList = pickList; C.bindPickAll = bindPickAll; C.picked = picked;

  /** แสดงรหัสผ่านชั่วคราว (ครั้งเดียว) พร้อมดาวน์โหลด/พิมพ์แจกนักเรียน */
  function showCredentials(list, title) {
    C.openModal('<h2 id="modal-title" style="margin-top:0">' + esc(title || 'บัญชีที่สร้างใหม่') + '</h2>' +
      '<div class="notice warn small">รหัสผ่านชั่วคราวแสดงครั้งเดียว ผู้ใช้ต้องเปลี่ยนรหัสผ่านเมื่อเข้าใช้ครั้งแรก กรุณาแจกเป็นรายบุคคลและไม่บันทึกไว้ในที่สาธารณะ</div>' +
      '<div class="table-wrap"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>รหัสผ่านชั่วคราว</th></tr></thead><tbody>' +
      list.map(function (a) { return '<tr><td>' + esc(a.username) + '</td><td>' + esc(a.name || '') + (a.room ? ' <span class="small muted">' + esc(a.room) + '</span>' : '') + '</td><td class="temp-pw">' + esc(a.tempPassword) + '</td></tr>'; }).join('') +
      '</tbody></table></div><p><button class="btn" id="cred-dl">ดาวน์โหลด CSV</button> <button class="btn ghost" data-close>ปิด</button></p>');
    on('#cred-dl', 'click', function () {
      download('accounts.csv', 'text/csv;charset=utf-8', csv([['ชื่อผู้ใช้', 'ชื่อ', 'ห้อง', 'รหัสผ่านชั่วคราว']].concat(list.map(function (a) { return [a.username, a.name || '', a.room || '', a.tempPassword]; }))));
    });
  }

  // ======================= สมัครใช้งาน (นักเรียน) =======================
  views.register = function (p) {
    h(backBtn() + '<div class="card" style="max-width:520px;margin:16px auto"><h1>สมัครใช้งาน (นักเรียน)</h1>' +
      '<p class="small muted">กรอกข้อมูลตามทะเบียนของโรงเรียน คำขอต้องได้รับการอนุมัติจากผู้ดูแลก่อนจึงเข้าสู่ระบบได้</p>' +
      '<form id="reg-form" novalidate>' +
      '<label for="r-code">รหัสนักเรียน</label><input id="r-code" type="text" inputmode="numeric" maxlength="30" autocomplete="username">' +
      '<div class="row"><div><label for="r-prefix">คำนำหน้า</label><select id="r-prefix">' + PREFIXES.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select></div>' +
      '<div><label for="r-first">ชื่อ</label><input id="r-first" type="text" maxlength="100"></div>' +
      '<div><label for="r-last">นามสกุล</label><input id="r-last" type="text" maxlength="100"></div></div>' +
      '<div class="row"><div><label for="r-class">ชั้น</label><input id="r-class" type="text" maxlength="20" placeholder="เช่น ม.5"></div>' +
      '<div><label for="r-room">ห้อง</label><input id="r-room" type="text" maxlength="20" placeholder="เช่น 1"></div>' +
      '<div><label for="r-roll">เลขที่</label><input id="r-roll" type="number" min="0"></div></div>' +
      '<label for="r-pw">ตั้งรหัสผ่าน (อย่างน้อย 8 ตัว)</label><input id="r-pw" type="password" autocomplete="new-password">' +
      '<label for="r-pw2">ยืนยันรหัสผ่าน</label><input id="r-pw2" type="password" autocomplete="new-password">' +
      (p.needsCode ? '<label for="r-regcode">รหัสลงทะเบียน (ขอจากครูหรือผู้ดูแล)</label><input id="r-regcode" type="text" maxlength="50">' : '') +
      '<div id="reg-msg"></div><p><button class="btn" type="submit">ส่งคำขอ</button></p></form></div>');
    bindBack();
    q('#reg-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (q('#r-pw').value !== q('#r-pw2').value) { q('#reg-msg').innerHTML = errBox({ message: 'รหัสผ่านทั้งสองช่องไม่ตรงกัน' }); return; }
      var btn = q('#reg-form button[type=submit]'); btn.disabled = true;
      api('auth.register', {
        studentCode: q('#r-code').value, prefix: q('#r-prefix').value, firstName: q('#r-first').value, lastName: q('#r-last').value,
        classLevel: q('#r-class').value, room: q('#r-room').value, rollNo: q('#r-roll').value, password: q('#r-pw').value,
        registrationCode: q('#r-regcode') ? q('#r-regcode').value : ''
      }).then(function (r) {
        q('#reg-form').innerHTML = '<div class="notice ok" role="status">' + esc(r.message) + '</div><p><button class="btn" type="button" data-back>กลับไปหน้าเข้าสู่ระบบ</button></p>';
        bindBack();
      }).catch(function (err) { q('#reg-msg').innerHTML = errBox(err); btn.disabled = false; });
    });
  };

  // ======================= เปิดรายวิชาที่สอน =======================
  views.offeringForm = function (p) {
    var isAdmin = C.state.role === 'admin';
    return Promise.all([api('course.catalog'), api('course.terms'), isAdmin ? api('registry.teachers') : Promise.resolve([])]).then(function (r) {
      var catalog = r[0], years = r[1], teachers = r[2];
      var terms = [];
      years.forEach(function (y) { y.terms.forEach(function (t) { if (t.status !== 'closed') terms.push(t); }); });
      if (!terms.length) {
        h(backBtn() + '<h1>เพิ่มรายวิชาที่สอน</h1><div class="notice warn">ยังไม่มีปีการศึกษา/ภาคเรียนที่เปิดอยู่ กรุณาให้ผู้ดูแลเพิ่มที่หน้า "รายวิชาและภาคเรียน"</div>');
        bindBack(); return;
      }
      h(backBtn() + '<h1>เพิ่มรายวิชาที่สอน</h1><form class="card" id="of" novalidate>' +
        '<label for="o-term">ปีการศึกษา / ภาคเรียน</label><select id="o-term">' + terms.map(function (t) { return '<option value="' + t.id + '">' + esc(t.label) + '</option>'; }).join('') + '</select>' +
        '<label for="o-course">รายวิชาในหลักสูตร</label><select id="o-course">' + catalog.filter(function (c) { return c.status === 'active'; }).map(function (c) {
          return '<option value="' + c.id + '">' + esc(c.code) + ' ' + esc(c.nameTh) + '</option>';
        }).join('') + '<option value="__new">+ เพิ่มรายวิชาใหม่ในหลักสูตร</option></select>' +
        '<div id="o-new" class="card" hidden><h3 style="margin-top:0">รายวิชาใหม่</h3><div class="row"><div><label for="c-code">รหัสวิชา</label><input id="c-code" type="text" maxlength="30" placeholder="เช่น ว32201"></div>' +
        '<div><label for="c-name">ชื่อวิชา</label><input id="c-name" type="text" maxlength="200"></div></div>' +
        '<div class="row"><div><label for="c-area">กลุ่มสาระ</label><input id="c-area" type="text" maxlength="100"></div><div><label for="c-level">ระดับชั้น</label><input id="c-level" type="text" maxlength="20"></div>' +
        '<div><label for="c-credit">หน่วยกิต</label><input id="c-credit" type="number" min="0" step="0.5"></div></div></div>' +
        '<div class="row"><div><label for="o-section">กลุ่มเรียน / ห้อง</label><input id="o-section" type="text" maxlength="30" placeholder="เช่น ม.5/1"></div>' +
        '<div><label for="o-calc">วิธีคำนวณคะแนน</label><select id="o-calc"><option value="per_item">น้ำหนักรายรายการ (รวม 100)</option><option value="per_category">น้ำหนักรายหมวด</option></select></div></div>' +
        (isAdmin ? '<label for="o-owner">ครูเจ้าของรายวิชา</label><select id="o-owner">' + teachers.filter(function (t) { return t.status === 'active'; }).map(function (t) { return '<option value="' + t.id + '">' + esc(t.code) + ' ' + esc(t.name) + '</option>'; }).join('') + '</select>' : '') +
        '<div id="of-msg"></div><p><button class="btn" type="submit">บันทึกและเปิดรายวิชา</button></p></form>');
      bindBack();
      var toggle = function () { q('#o-new').hidden = q('#o-course').value !== '__new'; };
      q('#o-course').addEventListener('change', toggle); toggle();
      q('#of').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = q('#of button[type=submit]'); btn.disabled = true;
        var courseStep = q('#o-course').value === '__new'
          ? api('course.save', { code: q('#c-code').value, nameTh: q('#c-name').value, learningArea: q('#c-area').value, gradeLevel: q('#c-level').value, credits: q('#c-credit').value }).then(function (c) { return c.id; })
          : Promise.resolve(q('#o-course').value);
        courseStep.then(function (courseId) {
          return api('offering.save', { courseId: courseId, termId: q('#o-term').value, sectionCode: q('#o-section').value, calcMethod: q('#o-calc').value, ownerTeacherId: q('#o-owner') ? q('#o-owner').value : undefined });
        }).then(function (o) { toast('เปิดรายวิชาแล้ว'); swap('teacherOffering', { offeringId: o.offeringId }); })
          .catch(function (err) { q('#of-msg').innerHTML = errBox(err); btn.disabled = false; });
      });
    });
  };

  // ======================= นักเรียนในรายวิชา (ลงทะเบียน/ถอน/รหัสเข้าร่วม) =======================
  views.offeringRoster = function (p) {
    return api('offering.roster', { offeringId: p.offeringId }).then(function (d) {
      var o = d.offering, can = o.perms.can_manage;
      h(backBtn() + offeringHeader(o) + C.offeringTabs(p, 'offeringRoster', o.perms) +
        '<p><span class="stat"><b>' + d.counts.active + '</b> กำลังเรียน</span><span class="stat"><b>' + (d.counts.total - d.counts.active) + '</b> ถอน/ย้ายออก</span></p>' +
        (can ? '<div class="card"><h2 style="margin-top:0">รหัสเข้าร่วมรายวิชา</h2>' +
          (o.joinEnabled ? '<p>นักเรียนลงทะเบียนเองได้ด้วยรหัส <span class="big-code" id="join-code">' + esc(o.joinCode) + '</span></p>' +
            '<p><button class="btn ghost small" id="join-regen">สร้างรหัสใหม่</button> <button class="btn ghost small" id="join-off">ปิดการลงทะเบียนเอง</button></p>'
            : '<p class="muted">ปิดอยู่ — นักเรียนลงทะเบียนเองไม่ได้</p><p><button class="btn small" id="join-on">เปิดให้ลงทะเบียนด้วยรหัส</button></p>') + '</div>' +
          '<div class="card"><h2 style="margin-top:0">เพิ่มนักเรียนเข้ารายวิชา</h2><p class="small muted">เลือกจากรายชื่อนักเรียนที่มีในระบบ (ผู้ดูแลเป็นผู้เพิ่มนักเรียนเข้าระบบ) การเพิ่มกลางภาคไม่สร้างคะแนนศูนย์ย้อนหลัง</p>' +
          '<div class="row"><div><label for="c-room">ห้อง</label><select id="c-room"><option value="">ทุกห้อง</option></select></div><div><label for="c-q">ค้นหา</label><input id="c-q" type="text" placeholder="รหัสหรือชื่อ"></div></div>' +
          '<div id="cand" style="margin-top:8px"><div class="loading">กำลังโหลด…</div></div><div id="enr-msg"></div><p><button class="btn" id="btn-enroll">ลงทะเบียนนักเรียนที่เลือก</button></p></div>' : '') +
        '<div class="card table-wrap"><table><thead><tr><th>ที่</th><th>รหัส</th><th>ชื่อ - สกุล</th><th>ห้อง</th><th class="hide-sm">เลขที่</th><th class="hide-sm">กลุ่ม</th><th>สถานะ</th><th></th></tr></thead><tbody>' +
        (d.students.length ? d.students.map(function (s, i) {
          return '<tr><td>' + (i + 1) + '</td><td>' + esc(s.code) + '</td><td>' + esc(s.name) + (s.source === 'self' ? ' <span class="chip neutral">ลงทะเบียนเอง</span>' : '') + '</td><td>' + esc(s.roomLabel) + '</td>' +
            '<td class="hide-sm">' + esc(s.rollNo === null ? '' : s.rollNo) + '</td><td class="hide-sm">' + esc(s.workGroup) + '</td>' +
            '<td><span class="chip ' + (s.status === 'active' ? 'ok' : 'neutral') + '">' + esc(ENR_STATUS[s.status] || s.status) + '</span></td>' +
            '<td>' + (can && s.status === 'active' ? '<button class="btn ghost small" data-withdraw="' + s.studentId + '" data-name="' + esc(s.name) + '">ถอน</button>' : '') + '</td></tr>';
        }).join('') : '<tr><td colspan="8" class="empty">ยังไม่มีนักเรียน</td></tr>') + '</tbody></table></div>');
      bindBack(); C.bindOfferingTabs(p);
      var setJoin = function (enabled, regen) {
        api('offering.setJoin', { offeringId: p.offeringId, enabled: enabled, regenerate: !!regen }).then(function () { render(); }).catch(function (err) { toast(err.message); });
      };
      on('#join-on', 'click', function () { setJoin(true); });
      on('#join-off', 'click', function () { setJoin(false); });
      on('#join-regen', 'click', function () { if (confirm('สร้างรหัสใหม่? รหัสเดิมจะใช้ไม่ได้')) setJoin(true, true); });
      on('[data-withdraw]', 'click', function (e) {
        var reason = prompt('เหตุผลที่ถอน ' + e.currentTarget.getAttribute('data-name') + ' ออกจากรายวิชา (ข้อมูลงานและคะแนนเดิมยังเก็บไว้)');
        if (!reason) return;
        api('offering.withdraw', { offeringId: p.offeringId, studentId: e.currentTarget.getAttribute('data-withdraw'), reason: reason }).then(function () { toast('ถอนแล้ว'); render(); }).catch(function (err) { toast(err.message); });
      });
      if (!can) return;
      var loadCand = function () {
        var room = q('#c-room').value.split('|');
        api('offering.candidates', { offeringId: p.offeringId, classLevel: room[0] || '', room: room[1] || '', q: q('#c-q').value }).then(function (c) {
          var sel = q('#c-room');
          if (sel.options.length === 1) c.rooms.forEach(function (r) { var op = document.createElement('option'); op.value = r.classLevel + '|' + r.room; op.textContent = r.label + ' (' + r.count + ')'; sel.appendChild(op); });
          q('#cand').innerHTML = pickList('enr', c.students, { empty: 'ไม่มีนักเรียนที่ยังไม่ได้ลงทะเบียน', label: 'นักเรียนที่เลือกได้' });
          bindPickAll(q('#cand'));
        }).catch(function (err) { q('#cand').innerHTML = errBox(err); });
      };
      var timer;
      q('#c-room').addEventListener('change', loadCand);
      q('#c-q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(loadCand, 300); });
      loadCand();
      on('#btn-enroll', 'click', function () {
        var ids = picked('enr', q('#cand'));
        if (!ids.length) { q('#enr-msg').innerHTML = errBox({ message: 'ยังไม่ได้เลือกนักเรียน' }); return; }
        api('offering.enroll', { offeringId: p.offeringId, studentIds: ids }).then(function (r) {
          toast('ลงทะเบียนเพิ่ม ' + (r.added + r.reactivated) + ' คน'); render();
        }).catch(function (err) { q('#enr-msg').innerHTML = errBox(err); });
      });
    });
  };

  // ======================= กลุ่มประจำรายวิชา (ครู/ผู้ดูแล) =======================
  views.workGroups = function (p) {
    return api('wg.overview', { offeringId: p.offeringId }).then(function (d) {
      var o = d.offering, st = d.settings, can = d.canManage;
      var everyone = d.ungrouped.map(function (u) { return { id: u.studentId, label: u.code + ' ' + u.name + ' (ยังไม่มีกลุ่ม)' }; });
      d.groups.forEach(function (g) { g.members.forEach(function (m) { everyone.push({ id: m.studentId, label: m.code + ' ' + m.name + ' (' + g.name + ')' }); }); });
      h(backBtn() + offeringHeader(o) + C.offeringTabs(p, 'workGroups', o.perms) +
        '<div class="notice info small">กลุ่มประจำรายวิชาใช้ทำงานกลุ่มได้หลายงาน เมื่อสร้างงานกลุ่มแบบ "ใช้กลุ่มประจำรายวิชา" ระบบสร้างกลุ่มของงานและสมาชิกให้อัตโนมัติ ' +
        'คะแนนกลุ่มของแต่ละงานเก็บที่กลุ่ม และบันทึกเป็นคะแนนรายบุคคลของสมาชิกโดยอัตโนมัติ เมื่องานถูกส่งหรือให้คะแนนแล้ว การย้ายกลุ่มภายหลังไม่ย้อนไปเปลี่ยนงานเดิม</div>' +

      });

        if (!confirm('ยุบกลุ่ม ' + e.currentTarget.getAttribute('data-gname') + '? (งานที่ส่ง/ให้คะแนนแล้วยังเก็บไว้ครบ)')) return;

      });

          }).join(', ') + '</p>' : '');

            '<div id="inv-pick">' + pickList('inv', d.classmates, { empty: 'ไม่มีเพื่อนที่ยังไม่มีกลุ่ม', label: 'เพื่อนที่ยังไม่มีกลุ่ม' }) + '</div>' +
            '<div id="inv-msg"></div><p><button class="btn" id="btn-inv"' + (d.classmates.length ? '' : ' disabled') + '>' + (st.leaderDirectAdd ? 'เพิ่มเข้ากลุ่ม' : 'ส่งคำเชิญ') + '</button></p>';
        }

        html += '</div>';
      } else {
        html += '<div class="notice warn">คุณยังไม่มีกลุ่มในรายวิชานี้</div>';
        if (d.invitations.length) html += '<div class="card"><h2 style="margin-top:0">คำเชิญถึงคุณ</h2>' + d.invitations.map(function (i) {
          return '<div class="file-row"><span><strong>' + esc(i.groupName) + '</strong> <span class="small muted">' + i.members.map(esc).join(', ') + '</span></span>' +
            '<span><button class="btn small" data-respond="' + i.memberId + '" data-ok="1">ตอบรับ</button> <button class="btn ghost small" data-respond="' + i.memberId + '" data-ok="0">ปฏิเสธ</button></span></div>';
        }).join('') + '</div>';
        if (!st.locked) html += '<div class="card"><h2 style="margin-top:0">สร้างกลุ่มใหม่ (คุณเป็นหัวหน้ากลุ่ม)</h2><div class="row"><input id="wg-name" type="text" maxlength="100" placeholder="ชื่อกลุ่ม" aria-label="ชื่อกลุ่ม"><button class="btn" id="btn-wg-create" style="flex:0 0 auto">สร้างกลุ่ม</button></div><div id="wg-msg"></div></div>';

      h(backBtn() + '<h1>นักเรียน</h1><p><button class="btn" id="btn-add">+ เพิ่มนักเรียน</button> <button class="btn ghost" id="btn-import">นำเข้าจาก Excel / CSV</button></p>' +
        '<div class="card"><div class="row"><div><label for="f-room">ห้อง</label><select id="f-room"><option value="">ทุกห้อง</option>' +
        d.rooms.map(function (r) { var v = r.classLevel + '|' + r.room; return '<option value="' + esc(v) + '"' + (v === (p.classLevel || '') + '|' + (p.room || '') ? ' selected' : '') + '>' + esc(r.label) + ' (' + r.count + ')</option>'; }).join('') + '</select></div>' +
        '<div><label for="f-status">สถานะ</label><select id="f-status"><option value="">ทั้งหมด</option>' + Object.keys(STUDENT_STATUS).map(function (k) {

        '<div class="card table-wrap"><table><thead><tr><th>รหัส</th><th>ชื่อ - สกุล</th><th>ห้อง</th><th class="hide-sm">เลขที่</th><th>บัญชี</th><th></th></tr></thead><tbody>' +
        (d.students.length ? d.students.map(function (s) {
          return '<tr><td>' + esc(s.code) + '</td><td>' + esc(s.name) + (s.status !== 'active' ? ' <span class="chip neutral">' + esc(STUDENT_STATUS[s.status]) + '</span>' : '') + '</td><td>' + esc(s.roomLabel) + '</td><td class="hide-sm">' + esc(s.rollNo === null ? '' : s.rollNo) + '</td>' +
            '<td>' + (s.username ? esc(s.username) + (s.accountStatus === 'disabled' ? ' <span class="chip bad">ปิดอยู่</span>' : s.mustChangePassword ? ' <span class="chip warn">ยังไม่เปลี่ยนรหัส</span>' : ' <span class="chip ok">ใช้งาน</span>') : '<span class="chip neutral">ยังไม่มีบัญชี</span>') + '</td>' +
            '<td><button class="btn ghost small" data-edit="' + s.id + '">แก้ไข</button> ' +
            (s.userId ? '<button class="btn ghost small" data-reset="' + s.userId + '" data-name="' + esc(s.name) + '">รีเซ็ตรหัส</button> <button class="btn ghost small" data-status="' + s.userId + '" data-to="' + (s.accountStatus === 'disabled' ? 'active' : 'disabled') + '">' + (s.accountStatus === 'disabled' ? 'เปิดบัญชี' : 'ปิดบัญชี') + '</button>'
              : '<button class="btn ghost small" data-account="' + s.id + '">สร้างบัญชี</button>') + '</td></tr>';
        }).join('') : '<tr><td colspan="6" class="empty">ไม่พบนักเรียน</td></tr>') + '</tbody></table></div>');
      bindBack();
      var reload = function () {
        var room = q('#f-room').value.split('|');
        swap('adminStudents', { classLevel: room[0] || '', room: room[1] || '', status: q('#f-status').value, q: q('#f-q').value });
      };
      q('#f-room').addEventListener('change', reload);
      q('#f-status').addEventListener('change', reload);
      q('#f-q').addEventListener('change', reload);
      on('#btn-add', 'click', function () { studentForm(null); });
      on('#btn-import', 'click', function () { go('adminImport'); });
      on('[data-edit]', 'click', function (e) { studentForm(d.students.filter(function (s) { return s.id === e.currentTarget.getAttribute('data-edit'); })[0]); });
      on('[data-reset]', 'click', function (e) {
        var b = e.currentTarget;
        if (!confirm('รีเซ็ตรหัสผ่านของ ' + b.getAttribute('data-name') + '? (ผู้ใช้จะถูกออกจากระบบทุกอุปกรณ์)')) return;

        }).catch(function (err) { toast(err.message); });
      });
      on('[data-status]', 'click', function (e) {
        var b = e.currentTarget, to = b.getAttribute('data-to');

        if (!reason) return;
        api('admin.setUserStatus', { userId: b.getAttribute('data-status'), status: to, reason: reason }).then(function () { toast('บันทึกแล้ว'); render(); }).catch(function (err) { toast(err.message); });
      });
      on('[data-account]', 'click', function (e) {
        api('admin.createStudentAccount', { studentId: e.currentTarget.getAttribute('data-account') }).then(function (r) {
          showCredentials([{ username: r.username, tempPassword: r.tempPassword }]); render();
        }).catch(function (err) { toast(err.message); });
      });
    });
  };

        var o = offerings.filter(function (x) { return x.offeringId === e.currentTarget.getAttribute('data-edit-off'); })[0];
        C.openModal('<h2 id="modal-title" style="margin-top:0">แก้ไขรายวิชาที่เปิดสอน</h2><form id="eo">' +
          '<p>' + esc(o.courseCode) + ' ' + esc(o.courseName) + ' · ปี ' + esc(o.yearBe) + ' ภาค ' + esc(o.termNo) + '</p>' +
          '<label for="eo-sec">กลุ่มเรียน</label><input id="eo-sec" type="text" value="' + esc(o.section) + '">' +
          '<label for="eo-owner">ครูเจ้าของรายวิชา</label><select id="eo-owner">' + teachers.map(function (t) { return '<option value="' + t.id + '"' + (t.id === o.ownerTeacherId ? ' selected' : '') + '>' + esc(t.code) + ' ' + esc(t.name) + '</option>'; }).join('') + '</select>' +
          '<label for="eo-status">สถานะ</label><select id="eo-status"><option value="open">เปิดสอน</option><option value="draft"' + (o.status === 'draft' ? ' selected' : '') + '>ฉบับร่าง (นักเรียนยังไม่เห็น)</option><option value="archived"' + (o.status === 'archived' ? ' selected' : '') + '>เก็บถาวร</option></select>' +
          '<label for="eo-calc">วิธีคำนวณ</label><select id="eo-calc"><option value="per_item">น้ำหนักรายรายการ</option><option value="per_category"' + (o.calcMethod === 'per_category' ? ' selected' : '') + '>น้ำหนักรายหมวด</option></select>' +
          '<div id="eo-msg"></div><p><button class="btn" type="submit">บันทึก</button> <button class="btn ghost" type="button" data-close>ยกเลิก</button></p></form>');
        q('#eo').addEventListener('submit', function (ev) {
          ev.preventDefault();
          api('offering.save', { id: o.offeringId, version: o.version, sectionCode: q('#eo-sec').value, ownerTeacherId: q('#eo-owner').value, status: q('#eo-status').value, calcMethod: q('#eo-calc').value })
            .then(function () { document.getElementById('modal').close(); toast('บันทึกแล้ว'); render(); }).catch(function (err) { q('#eo-msg').innerHTML = errBox(err); });
        });
      });
      var courseForm = function (c) {
        var v = c || {};
        C.openModal('<h2 id="modal-title" style="margin-top:0">' + (c ? 'แก้ไขรายวิชา' : 'เพิ่มรายวิชาในหลักสูตร') + '</h2><form id="cf">' +
          '<div class="row"><div><label for="cf-code">รหัสวิชา</label><input id="cf-code" type="text" maxlength="30" value="' + esc(v.code || '') + '"></div><div><label for="cf-name">ชื่อวิชา</label><input id="cf-name" type="text" maxlength="200" value="' + esc(v.nameTh || '') + '"></div></div>' +
          '<div class="row"><div><label for="cf-area">กลุ่มสาระ</label><input id="cf-area" type="text" value="' + esc(v.learningArea || '') + '"></div><div><label for="cf-level">ระดับชั้น</label><input id="cf-level" type="text" value="' + esc(v.gradeLevel || '') + '"></div>' +
          '<div><label for="cf-credit">หน่วยกิต</label><input id="cf-credit" type="number" step="0.5" min="0" value="' + esc(v.credits || '') + '"></div></div>' +
          '<label for="cf-desc">คำอธิบายรายวิชา</label><textarea id="cf-desc">' + esc(v.description || '') + '</textarea>' +
          '<div id="cf-msg"></div><p><button class="btn" type="submit">บันทึก</button> <button class="btn ghost" type="button" data-close>ยกเลิก</button></p></form>');
        q('#cf').addEventListener('submit', function (ev) {
          ev.preventDefault();
          api('course.save', { id: c ? c.id : undefined, version: c ? c.version : undefined, code: q('#cf-code').value, nameTh: q('#cf-name').value, learningArea: q('#cf-area').value, gradeLevel: q('#cf-level').value, credits: q('#cf-credit').value, description: q('#cf-desc').value })
            .then(function () { document.getElementById('modal').close(); toast('บันทึกแล้ว'); render(); }).catch(function (err) { q('#cf-msg').innerHTML = errBox(err); });
        });
      };
      on('#c-add', 'click', function () { courseForm(null); });
      on('[data-edit-c]', 'click', function (e) { courseForm(catalog.filter(function (c) { return c.id === e.currentTarget.getAttribute('data-edit-c'); })[0]); });
    });
  };

  // ======================= ผู้ดูแล: คำขอลงทะเบียน =======================
  views.adminRegistrations = function (p) {
    p = p || {};
    return Promise.all([api('admin.registrations', { status: p.status || 'pending' }), api('admin.status')]).then(function (r) {
      var list = r[0], st = r[1].settings;
      h(backBtn() + '<h1>คำขอลงทะเบียนของนักเรียน</h1>' +
        '<form class="card" id="rs"><h2 style="margin-top:0">การสมัครใช้งานด้วยตนเอง</h2>' +
        '<label class="check"><input id="rs-on" type="checkbox"' + (st.self_registration_enabled ? ' checked' : '') + '> เปิดให้นักเรียนสมัครใช้งานจากหน้าเข้าสู่ระบบ (ทุกคำขอต้องรออนุมัติ)</label>' +
        '<label for="rs-code">รหัสลงทะเบียน (ไม่บังคับ — ถ้าตั้งไว้ นักเรียนต้องกรอกรหัสนี้)</label><input id="rs-code" type="text" maxlength="50" value="' + esc(st.self_registration_code || '') + '">' +
        '<div id="rs-msg"></div><p><button class="btn small" type="submit">บันทึก</button></p></form>' +
        '<label for="rq-status">แสดง</label><select id="rq-status"><option value="pending">รออนุมัติ</option><option value="approved"' + (p.status === 'approved' ? ' selected' : '') + '>อนุมัติแล้ว</option><option value="rejected"' + (p.status === 'rejected' ? ' selected' : '') + '>ปฏิเสธแล้ว</option><option value="all"' + (p.status === 'all' ? ' selected' : '') + '>ทั้งหมด</option></select>' +
        '<div class="card table-wrap"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>ห้อง</th><th class="hide-sm">ส่งเมื่อ</th><th>หมายเหตุ</th><th></th></tr></thead><tbody>' +
        (list.length ? list.map(function (x) {
          return '<tr><td>' + esc(x.code) + '</td><td>' + esc(x.name) + '</td><td>' + esc(x.roomLabel) + '</td><td class="hide-sm">' + fmtDate(x.createdAt) + '</td><td class="small">' +
            (x.existing ? (x.existing.hasAccount ? '<span class="chip bad">รหัสนี้มีบัญชีแล้ว</span>' : 'มีทะเบียนรหัสนี้แล้ว: ' + esc(x.existing.name) + ' (' + esc(x.existing.roomLabel) + ') — อนุมัติแล้วจะผูกบัญชีกับทะเบียนเดิม') : '') + esc(x.reason || '') + '</td>' +
            '<td>' + (x.status === 'pending' ? '<button class="btn small" data-approve="' + x.id + '">อนุมัติ</button> <button class="btn ghost small" data-reject="' + x.id + '">ปฏิเสธ</button>' : '<span class="chip ' + (x.status === 'approved' ? 'ok' : 'neutral') + '">' + (x.status === 'approved' ? 'อนุมัติแล้ว' : 'ปฏิเสธแล้ว') + '</span>') + '</td></tr>';
        }).join('') : '<tr><td colspan="6" class="empty">ไม่มีคำขอ</td></tr>') + '</tbody></table></div>');
      bindBack();
      q('#rq-status').addEventListener('change', function () { swap('adminRegistrations', { status: q('#rq-status').value }); });
      q('#rs').addEventListener('submit', function (e) {
        e.preventDefault();
        api('admin.updateSettings', { changes: { self_registration_enabled: q('#rs-on').checked, self_registration_code: q('#rs-code').value } }).then(function () { toast('บันทึกแล้ว'); render(); }).catch(function (err) { q('#rs-msg').innerHTML = errBox(err); });
      });
      on('[data-approve]', 'click', function (e) { api('admin.decideRegistration', { id: e.currentTarget.getAttribute('data-approve'), approve: true }).then(function () { toast('อนุมัติแล้ว นักเรียนเข้าสู่ระบบด้วยรหัสผ่านที่ตั้งไว้ได้'); render(); }).catch(function (err) { toast(err.message); }); });
      on('[data-reject]', 'click', function (e) {
        var reason = prompt('เหตุผลที่ปฏิเสธ (ไม่บังคับ)');
        if (reason === null) return;
        api('admin.decideRegistration', { id: e.currentTarget.getAttribute('data-reject'), approve: false, reason: reason }).then(function () { toast('ปฏิเสธแล้ว'); render(); }).catch(function (err) { toast(err.message); });
      });
    });
  };
})(window.CWK);
</script>
