<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1d2433; --muted: #5b6475; --line: #dde2ec;
    --primary: #1f5fbf; --primary-ink: #ffffff; --ok: #1d7a45; --warn: #9a5b00; --bad: #b3261e; --info: #1f5fbf;
    --ok-bg: #e6f4ec; --warn-bg: #fff3dc; --bad-bg: #fdeceb; --info-bg: #e8f0fc;
    --radius: 12px; --gap: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151c; --card: #1a202a; --text: #e8ecf3; --muted: #a3adbf; --line: #2c3442;
      --primary: #7fb0ff; --primary-ink: #0d1420; --ok: #7ad3a0; --warn: #f2c26b; --bad: #ff9a8f; --info: #7fb0ff;
      --ok-bg: #173325; --warn-bg: #3a2c12; --bad-bg: #3d1a18; --info-bg: #182a47;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--primary); }
  .skip { position: absolute; left: -999px; }
  .skip:focus { left: 8px; top: 8px; background: var(--card); padding: 8px; z-index: 10; }
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .brand { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; flex: 1; }
  .brand span { font-weight: 700; }
  .brand small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-actions { display: flex; align-items: center; gap: 6px; }
  .demo-banner { background: var(--warn-bg); color: var(--warn); text-align: center; padding: 4px 16px; font-weight: 600; }
  main { max-width: 1080px; margin: 0 auto; padding: 16px; outline: none; }
  h1 { font-size: 1.4rem; margin: 4px 0 12px; }
  h2 { font-size: 1.15rem; margin: 20px 0 8px; }
  h3 { font-size: 1rem; margin: 12px 0 6px; }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: var(--gap); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list > li { border-top: 1px solid var(--line); padding: 12px 0; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .list > li:first-child { border-top: 0; }
  .clickable { cursor: pointer; }
  .clickable:hover { background: color-mix(in srgb, var(--primary) 6%, transparent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--primary); background: var(--primary); color: var(--primary-ink); font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--primary); }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.small { min-height: 36px; padding: 4px 12px; font-size: .9rem; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .icon-btn { min-width: 44px; min-height: 44px; border: 0; background: transparent; font-size: 1.2rem; cursor: pointer; position: relative; border-radius: 10px; }
  .badge { position: absolute; top: 4px; right: 2px; background: var(--bad); color: #fff; font-size: .7rem; border-radius: 999px; padding: 0 5px; }
  .back { margin-bottom: 8px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], input[type=password], input[type=number], input[type=datetime-local], input[type=url], select, textarea {
    width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  }
  textarea { min-height: 88px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 1px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 200px; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
  .chip.ok { color: var(--ok); background: var(--ok-bg); }
  .chip.warn { color: var(--warn); background: var(--warn-bg); }
  .chip.bad { color: var(--bad); background: var(--bad-bg); }
  .chip.info { color: var(--info); background: var(--info-bg); }
  .chip.neutral { color: var(--muted); }
  .notice { border-radius: 10px; padding: 10px 12px; margin: 8px 0; border: 1px solid; }
  .notice.info { background: var(--info-bg); border-color: var(--info); }
  .notice.warn { background: var(--warn-bg); border-color: var(--warn); }
  .notice.bad { background: var(--bad-bg); border-color: var(--bad); }
  .notice.ok { background: var(--ok-bg); border-color: var(--ok); }
  .progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .progress > div { height: 100%; background: var(--primary); width: 0; transition: width .2s; }
  .file-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px dashed var(--line); flex-wrap: wrap; }
  .file-row:first-child { border-top: 0; }
  .file-name { word-break: break-all; }
  .drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 16px; text-align: center; }
  .drop.over { border-color: var(--primary); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--card); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 20; }
  dialog { border: 0; border-radius: var(--radius); padding: 0; max-width: min(720px, calc(100% - 32px)); width: 100%; background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  .modal-body { padding: 20px; }
  .preview-frame { width: 100%; height: 70vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .preview-img { max-width: 100%; height: auto; border-radius: 8px; }
  .receipt { font-variant-numeric: tabular-nums; }
  .receipt code { font-size: 1.25rem; font-weight: 700; letter-spacing: 1px; }
  .loading { padding: 24px; text-align: center; color: var(--muted); }
  .empty { padding: 16px; text-align: center; color: var(--muted); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .breadcrumb { color: var(--muted); font-size: .9rem; margin-bottom: 4px; }
  pre.text-preview { white-space: pre-wrap; word-break: break-word; max-height: 60vh; overflow: auto; background: var(--bg); padding: 12px; border-radius: 8px; }
  /* แท็บในหน้ารายวิชา */
  .tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 2px solid var(--line); margin: 4px 0 16px; scrollbar-width: thin; }
  .tab { flex: 0 0 auto; min-height: 44px; padding: 8px 14px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab:hover { color: var(--text); }
  /* ตารางคะแนน */
  .grade-table { font-size: .9rem; }
  .grade-table th, .grade-table td { padding: 6px 8px; white-space: nowrap; }
  .grade-table th.sticky, .grade-table td.sticky { position: sticky; left: 0; background: var(--card); z-index: 1; }
  .grade-table thead th.sticky { z-index: 2; }
  .grade-table td.num, .grade-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .grade-table .cell { cursor: pointer; border-radius: 6px; padding: 2px 6px; display: inline-block; min-width: 2.5em; text-align: right; }
  .grade-table .cell:hover { background: var(--info-bg); }
  .grade-table .cell.override { outline: 1px dashed var(--warn); }
  .grade-table .cell.dirty::after { content: '•'; color: var(--warn); margin-left: 2px; }
  .table-scroll { overflow: auto; max-height: 70vh; }
  input.score { width: 6em; min-height: 40px; text-align: right; }
  select.compact, input.compact { width: auto; min-height: 40px; padding: 4px 8px; }
  tr.changed td { background: var(--warn-bg); }
  tr.saved td { background: var(--ok-bg); }
  /* รายการเลือกหลายคน */
  .pick-list { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px; background: var(--bg); }
  .pick-list label { font-weight: 400; margin: 0; padding: 6px 0; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--line); }
  .pick-list label:first-child { border-top: 0; }
  .pick-list input[type=checkbox] { width: 20px; height: 20px; }
  .member-list { list-style: none; padding: 0; margin: 8px 0; }
  .member-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); flex-wrap: wrap; }
  .member-list li:first-child { border-top: 0; }
  .big-code { font-size: 1.8rem; font-weight: 700; letter-spacing: 4px; font-variant-numeric: tabular-nums; }
  .stat { display: inline-flex; flex-direction: column; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; margin: 0 8px 8px 0; background: var(--card); }
  .stat b { font-size: 1.3rem; }
  .temp-pw { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; letter-spacing: 1px; }
  /* หน้ารายงาน (PDF จากการพิมพ์ของเบราว์เซอร์) */
  .report-page { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
  .report-page h1 { font-size: 1.3rem; margin: 0 0 4px; text-align: center; }
  .report-page .r-school { text-align: center; font-weight: 700; }
  .report-page .r-course { text-align: center; margin-bottom: 8px; }
  .report-page .r-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px 16px; font-size: .9rem; margin: 8px 0 12px; }
  .report-page .r-meta b { font-weight: 600; }
  .report-page .r-provisional { border: 1px solid #9a5b00; color: #9a5b00; background: #fff3dc; padding: 4px 8px; border-radius: 6px; font-weight: 700; text-align: center; margin: 6px 0; }
  .report-page h2 { font-size: 1.05rem; margin: 16px 0 6px; break-after: avoid; }
  .report-page table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .report-page th, .report-page td { border: 1px solid #9aa3b2; padding: 3px 5px; vertical-align: top; color: #111; background: #fff; position: static; }
  .report-page thead th { background: #e8eef7; }
  .report-page thead { display: table-header-group; }
  .report-page tr { break-inside: avoid; }
  .report-page td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .report-page td.nowrap { white-space: nowrap; }
  .report-page .r-notes { font-size: .82rem; margin-top: 12px; }
  .report-page .r-sign { display: flex; justify-content: space-around; margin-top: 36px; font-size: .9rem; text-align: center; break-inside: avoid; }
  @media print {
    html, body { background: #fff !important; }
    .topbar, .demo-banner, .no-print, .skip, .toast { display: none !important; }
    main { max-width: none; padding: 0; }
    .report-page { border: 0; padding: 0; }
    a[href]::after { content: none; }
  }
  @media (max-width: 600px) {
    main { padding: 12px; }
    .brand small { display: none; }
    .hide-sm { display: none; }
  }
</style>
